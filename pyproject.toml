[project]
name = "legal-rag"
version = "1.1.0"
description = "API de Perguntas e Respostas sobre documentos usando RAG (LLM + FAISS + Groq)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "langchain>=0.3.19",
    "langchain-groq>=0.2.4",
    "langchain-community>=0.3.18",
    "langchain-huggingface>=0.1.2",
    "faiss-cpu>=1.7.4",
    "pypdf>=4.0.1",
    "sentence-transformers>=3.0.1",
    "einops",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: testes que carregam modelos reais (offline por padrão)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # conflita com line-length em strings longas

[tool.coverage.run]
source = ["app"]
omit = ["app/core/logging.py"]
